[workspace]
authors = ["Robert Douglas <rwdougla@gmail.com>"]
channels = ["conda-forge"]
name = "sessions"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[environments]
default = ["gcc-15-2"]
gcc-15-2 = ["gcc-15-2"]
gcc-14-2 = ["gcc-14-2"]
clang = ["clang"]

[dependencies]
boost = ">=1.85.0,<2"

[feature.clang.dependencies]
clangxx = ">=21.1.8,<22"
libcxx = ">=21.1.8,<22"
libcxx-devel = ">=21.1.8,<22"

[feature.gcc-15-2.dependencies]
gcc = ">=15.2.0,<15.3"
gxx = ">=15.2.0,<15.3"

[feature.gcc-14-2.dependencies]
gcc = ">=14.2.0,<14.3"
gxx = ">=14.2.0,<14.3"